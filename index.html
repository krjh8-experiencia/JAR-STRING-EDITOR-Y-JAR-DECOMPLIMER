<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jar Explorer Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>☕ Jar Explorer Web</h1>
  <input type="file" id="jarInput" accept=".jar">
</header>

<div id="container">
  <aside id="tree"></aside>

  <main>
    <textarea id="editor" placeholder="Selecciona un archivo..."></textarea>

    <div class="actions">
      <button id="saveFile">💾 Guardar archivo</button>
      <button id="downloadJar">⬇️ Descargar JAR</button>
    </div>

    <section id="stringEditor">
      <h3>🔎 String Editor</h3>
      <input id="searchStr" placeholder="Buscar">
      <input id="replaceStr" placeholder="Reemplazar">
      <button id="applyStrings">Aplicar</button>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
